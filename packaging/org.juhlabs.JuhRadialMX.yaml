# Experimental KDE/x86_64 package. See the accompanying build notes.
app-id: org.juhlabs.JuhRadialMX
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.rust-stable
command: juhradial-mx
finish-args:
- --env=QT_PLUGIN_PATH=/app/lib/plugins:/usr/lib/plugins
- --env=QML2_IMPORT_PATH=/app/lib/qml:/usr/lib/qml
- --share=ipc
- --socket=wayland
- --socket=x11
- --device=all
- --own-name=org.kde.juhradialmx
- --own-name=org.kde.juhradialmx.*
- --talk-name=org.kde.KWin
- --talk-name=org.kde.kglobalaccel
- --talk-name=org.kde.StatusNotifierWatcher
- --talk-name=org.freedesktop.Notifications
- --talk-name=org.freedesktop.ScreenSaver
- --talk-name=org.mpris.MediaPlayer2.*
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env: {}
modules:
- python-sources.json
- name: juhradiald
  buildsystem: simple
  build-options:
    env:
      CARGO_HOME: /run/build/juhradiald/cargo
      CARGO_BUILD_JOBS: '4'
  build-commands:
  - cargo --offline build --locked --manifest-path daemon/Cargo.toml --release
  - cargo --offline test --locked --manifest-path crates/mx-keypad/Cargo.toml
  - install -Dm755 daemon/target/release/juhradiald /app/bin/juhradiald
  sources:
  - type: dir
    path: ../daemon
    dest: daemon
    skip:
    - target
    - fuzz
  - type: dir
    path: ../crates/mx-keypad
    dest: crates/mx-keypad
    skip:
    - target
  - cargo-sources.json
- name: juhradial-mx
  buildsystem: simple
  build-commands:
  - mkdir -p /app/share/juhradial
  - install -Dm644 overlay/*.py /app/share/juhradial/
  - cp -r overlay/flow overlay/locales /app/share/juhradial/
  - mkdir -p /app/share/juhradial/assets
  - cp -r assets/* /app/share/juhradial/assets/
  - install -Dm644 assets/juhradial-mx.svg /app/share/icons/hicolor/scalable/apps/org.juhlabs.JuhRadialMX.svg
  - mkdir -p /app/share/juhradial/settings-qt
  - cp -r settings-qt/assets /app/share/juhradial/settings-qt/
  - cp -r settings-qt/assets/wheels /app/share/juhradial/assets/
  - cp settings-qt/main.py settings-qt/VERSION /app/share/juhradial/settings-qt/
  - cp -r settings-qt/bridge settings-qt/qml /app/share/juhradial/settings-qt/
  - install -Dm755 packaging/flatpak-launcher.py /app/bin/juhradial-mx
  - ln -s juhradial-mx /app/bin/juhradial-settings
  - install -Dm644 packaging/juhradial-mx.desktop /app/share/applications/org.juhlabs.JuhRadialMX.desktop
  - sed -i 's|Exec=.*|Exec=juhradial-mx|g' /app/share/applications/org.juhlabs.JuhRadialMX.desktop
  - sed -i 's|Icon=.*|Icon=org.juhlabs.JuhRadialMX|g' /app/share/applications/org.juhlabs.JuhRadialMX.desktop
  - install -Dm644 packaging/org.juhlabs.JuhRadialMX.metainfo.xml /app/share/metainfo/org.juhlabs.JuhRadialMX.metainfo.xml
  sources:
  - type: dir
    path: ..
    skip:
    - .git
    - daemon/target
    - .flatpak-builder
    - build-dir
    - __pycache__
    - daemon
    - crates
